<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>巴黎两日功能示例</title>
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="assets/trip-map-core.css">
</head>
<body>
  <main class="trip-app" id="trip-app">
    <aside class="planner-shell" aria-label="旅行计划">
      <div class="planner-inner">
        <section id="trip-overview">
          <header class="trip-header">
            <div class="trip-eyebrow">旅行地图基础示例</div>
            <h1 class="trip-title" id="trip-title">巴黎两日功能示例</h1>
            <p class="trip-summary" id="trip-summary"></p>
            <div class="trip-stats" aria-label="旅行概览">
              <div class="trip-stat"><strong id="trip-day-count">0</strong><span>旅行日</span></div>
              <div class="trip-stat"><strong id="trip-place-count">0</strong><span>地点</span></div>
              <div class="trip-stat"><strong id="trip-city-count">0</strong><span>城市/区域</span></div>
            </div>
            <button class="text-button primary map-export-trigger" id="open-map-export" type="button">导出到 Google My Maps</button>
          </header>

          <section class="section-block" aria-labelledby="days-heading">
            <div class="section-heading-row">
              <div><div class="section-kicker">先看路线骨架</div><h2 class="section-title" id="days-heading">每日路线</h2></div>
            </div>
            <div class="day-list" id="day-list"></div>
          </section>

          <section class="section-block" aria-labelledby="quick-heading">
            <div class="section-heading-row">
              <div><div class="section-kicker">再浏览完整候选</div><h2 class="section-title" id="quick-heading">地点速查</h2></div>
            </div>
            <div class="filter-grid">
              <input class="filter-control search-control" id="quick-search" type="search" data-filter-field="search" placeholder="搜索地点、街区或说明" aria-label="搜索地点">
              <select class="filter-control" id="filter-city" data-filter-field="city" aria-label="按城市或区域筛选"></select>
              <select class="filter-control" id="filter-category" data-filter-field="category" aria-label="按类别筛选"></select>
              <select class="filter-control" id="filter-priority" data-filter-field="priority" aria-label="按优先级筛选"></select>
              <select class="filter-control" id="filter-plan" data-filter-field="plan" aria-label="按行程归类筛选"></select>
            </div>
            <div class="quick-list-meta"><span id="quick-count">0 个地点</span><button class="text-button" id="clear-filters" type="button">清空筛选</button></div>
            <div class="quick-list" id="quick-list"></div>
          </section>
        </section>

        <section id="detail-browse" hidden>
          <div class="detail-layout">
            <nav class="day-rail" id="day-rail" aria-label="按日期切换行程"></nav>
            <div class="detail-stack">
              <section id="day-place-list" aria-label="当天安排"></section>
              <article class="poi-detail" id="poi-detail" aria-live="polite"></article>
            </div>
          </div>
        </section>
      </div>

      <section class="change-summary" id="change-summary" hidden aria-live="polite">
        <div class="change-heading"><div><h2>行程有新调整</h2><p id="change-summary-text"></p></div></div>
        <div class="change-actions">
          <button class="text-button" id="undo-change" type="button">撤销上一步</button>
          <button class="text-button primary" id="request-replan" type="button">请 Codex 重新安排</button>
        </div>
      </section>
    </aside>

    <section class="map-stage" aria-label="地图区域">
      <div id="map" aria-label="旅行地图"></div>
      <div class="map-note" id="map-note" aria-live="polite"></div>
    </section>
  </main>

  <section class="dialog-backdrop" id="impact-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="impact-title">
    <div class="dialog-panel">
      <div class="dialog-heading"><div><div class="section-kicker">这次调整影响较大</div><h2 id="impact-title">确认后再保存</h2></div></div>
      <p>请先确认这些影响：</p>
      <ul id="impact-reasons"></ul>
      <p class="muted">保存后仍会标记为“路线需要重新安排”，不会自动生成未经复核的新路线。</p>
      <div class="dialog-actions">
        <button class="text-button" id="cancel-impact" type="button">取消</button>
        <button class="text-button primary" id="confirm-impact" type="button">确认这次调整</button>
      </div>
    </div>
  </section>

  <section class="dialog-backdrop" id="replan-dialog" hidden role="dialog" aria-modal="true" aria-labelledby="replan-title">
    <div class="dialog-panel">
      <div class="dialog-heading"><div><div class="section-kicker">我的行程调整</div><h2 id="replan-title">请 Codex 重新安排</h2></div><button class="icon-button" id="close-replan" type="button" aria-label="关闭">×</button></div>
      <p class="muted">下面的文字包含全部修改和受影响日期，可以独立发送。</p>
      <textarea id="replan-text" readonly aria-label="重新安排行程请求"></textarea>
      <div class="dialog-actions"><button class="text-button primary" id="copy-replan" type="button">复制给 Codex</button></div>
      <div class="copy-feedback" id="copy-feedback" aria-live="polite"></div>
    </div>
  </section>

  <dialog class="dialog-backdrop" id="map-export-dialog" hidden aria-labelledby="map-export-title" aria-describedby="map-export-description">
    <div class="dialog-panel map-export-panel">
      <div class="dialog-heading"><div><div class="section-kicker">保存当前地图安排</div><h2 id="map-export-title">导出到 Google My Maps</h2></div><button class="icon-button" id="close-map-export" type="button" aria-label="关闭导出窗口">×</button></div>
      <p class="muted" id="map-export-description">每次下载一个文件，避免浏览器拦截多个下载。三个文件都会使用你当前保存的地点顺序和优先级。</p>
      <div class="map-export-files">
        <button class="text-button" type="button" data-export-file="places.csv">下载 places.csv</button>
        <button class="text-button" type="button" data-export-file="itinerary.kml">下载 itinerary.kml</button>
        <button class="text-button" type="button" data-export-file="README.md">下载 README.md</button>
      </div>
      <div class="map-export-error" id="map-export-error" role="status" aria-live="polite"></div>
    </div>
  </dialog>

        { id: "paris-musee-orsay", name: "Musee d'Orsay", name_zh: "奥赛博物馆", city: "巴黎", area: "7e arrondissement", category: "art", priority: "preferred", coords: [48.86, 2.3266], note: "从火车站改造空间理解法国十九世纪艺术，也是左岸艺术路线最合适的开场。", plan: "第一天上午作为主锚点，之后沿左岸向罗丹美术馆移动。", tip: "开放时间和临展会变化，出发前用官网复核并提前订票。", source: "template-example", officialUrl: "https://www.musee-orsay.fr/", mapUrl: "https://www.google.com/maps/search/?api=1&query=Musee+d%27Orsay+Paris", experienceUrl: "https://www.xiaohongshu.com/search_result?keyword=奥赛博物馆" },

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="assets/trip-map-state.js"></script>
  <script src="assets/trip-map-delivery.js"></script>
  <script src="assets/trip-map-core.js"></script>
  <script>
    window.TripMapCore.mount({ root: document.getElementById("trip-app"), trip: window.TRIP_DATA });
  </script>
</body>
</html>
